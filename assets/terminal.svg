<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-label="A soft pink terminal window introducing a developer who likes things to look nice">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6fb"/>
      <stop offset="100%" stop-color="#ffdceb"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe7f1"/>
      <stop offset="100%" stop-color="#ffd2e4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ff9ec0" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card -->
  <g filter="url(#glow)">
    <rect x="1" y="1" width="638" height="178" rx="18" fill="url(#body)" stroke="#ffc2d8" stroke-width="1.5"/>
  </g>

  <!-- Title bar -->
  <path d="M19 1 H621 a17 17 0 0 1 17 17 v14 H2 V18 a17 17 0 0 1 17-17 z" fill="url(#titlebar)"/>
  <path d="M1 33 H639" stroke="#ffc9de" stroke-width="1"/>

  <!-- Pastel traffic dots -->
  <circle cx="26" cy="17" r="5" fill="#ff9ebc"/>
  <circle cx="46" cy="17" r="5" fill="#ffd29e"/>
  <circle cx="66" cy="17" r="5" fill="#a9e0b3"/>

  <!-- Title -->
  <text x="320" y="21.5" text-anchor="middle" font-family="Consolas, 'Fira Code', 'JetBrains Mono', monospace" font-size="10.5" fill="#c46a93">~/ hello.txt</text>

  <!-- Twinkling sparkles -->
  <text x="594" y="24" font-family="Consolas, monospace" font-size="12" fill="#ff7aa8" opacity="0">
    ✦
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
  </text>
  <text x="614" y="84" font-family="Consolas, monospace" font-size="9" fill="#ffa6c8" opacity="0">
    ✧
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" begin="1.1s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="146" font-family="Consolas, monospace" font-size="11" fill="#ff8fae" opacity="0">
    ✦
    <animate attributeName="opacity" values="0.15;1;0.15" dur="3.6s" begin="2s" repeatCount="indefinite"/>
  </text>

  <!-- Terminal lines — edit the words to make them yours -->
  <text x="28" y="58" font-family="Consolas, 'Fira Code', 'JetBrains Mono', monospace" font-size="13.5" fill="#c25e8a" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.4s" fill="freeze"/>
    <tspan fill="#f04c8f" font-weight="700">$ </tspan>whoami
  </text>

  <text x="28" y="82" font-family="Consolas, 'Fira Code', 'JetBrains Mono', monospace" font-size="13.5" fill="#7d4a60" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.9s" fill="freeze"/>
    <tspan fill="#ff6f9f">&#9656;&#160;</tspan>a developer who likes things to look nice
  </text>

  <text x="28" y="106" font-family="Consolas, 'Fira Code', 'JetBrains Mono', monospace" font-size="13.5" fill="#c25e8a" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.4s" fill="freeze"/>
    <tspan fill="#f04c8f" font-weight="700">$ </tspan>./stack
  </text>

  <text x="28" y="130" font-family="Consolas, 'Fira Code', 'JetBrains Mono', monospace" font-size="13.5" fill="#7d4a60" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.9s" fill="freeze"/>
    <tspan fill="#ff6f9f">&#9656;&#160;</tspan>python &#183; typescript &#183; react &#183; curiosity
  </text>

  <!-- Blinking prompt -->
  <text x="28" y="156" font-family="Consolas, 'Fira Code', 'JetBrains Mono', monospace" font-size="13.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.4s" fill="freeze"/>
    <tspan fill="#f04c8f" font-weight="700">$</tspan>
  </text>
  <rect x="38" y="147" width="8" height="10" rx="1.5" fill="#f04c8f" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.6s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" begin="2.8s" repeatCount="indefinite"/>
  </rect>
</svg>
